name: Build Babigo Content JSON
on:
  push:
    paths:
      - 'content/**'
      - '.github/workflows/build-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate content.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function parseDir(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir)
                .filter(f => f.endsWith(".md"))
                .map(file => {
                  const raw = fs.readFileSync(path.join(dir, file), "utf8");
                  const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
                  const meta = {};
                  let body = raw;
                  if (match) {
                    body = match[2].trim();
                    let currentKey = null;
                    match[1].split(/\r?\n/).forEach(line => {
                      const listMatch = line.match(/^\s*-\s+(.*)$/);
                      if (listMatch && currentKey) {
                        const item = listMatch[1].trim().replace(/^["\x27]|["\x27]$/g, "");
                        if (!Array.isArray(meta[currentKey])) meta[currentKey] = [];
                        meta[currentKey].push(item);
                        return;
                      }
                      const idx = line.indexOf(":");
                      if (idx > -1) {
                        currentKey = line.slice(0, idx).trim();
                        let val = line.slice(idx + 1).trim();
                        if (val === "") {
                          meta[currentKey] = [];
                        } else {
                          val = val.replace(/^["\x27]|["\x27]$/g, "");
                          meta[currentKey] = val;
                        }
                      }
                    });
                  }
                  return { slug: file.replace(/\.md$/, ""), ...meta, body };
                });
            }

            const data = {
              posts: parseDir("content/posts"),
              recipes: parseDir("content/recipes")
            };
            fs.writeFileSync("content.json", JSON.stringify(data, null, 2));
          '
      - name: Commit content.json
        run: |
          git config user.name "Babigo Bot"
          git config user.email "hello@babigo.hu"
          git add content.json
          git diff --staged --quiet || git commit -m "Update content.json"
          git push
